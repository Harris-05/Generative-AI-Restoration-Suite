# Starts the whole application with one command:  docker compose up --build
#
#   Frontend:  http://localhost:8080
#   Backend:   http://localhost:8000   (API docs at /docs)
#
# Before the first start, place the exported ONNX models in Backend/models/ (see Backend/README.md).
# The backend still starts without them, and each endpoint reports which model is missing.

services:
  backend:
    build:
      context: ./Backend
    image: restoration-studio-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/models:/app/models:ro
    environment:
      # Allow the frontend running on port 8080 to call this API.
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/app
      args:
        VITE_API_URL: http://localhost:8000
    image: restoration-studio-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
